name: Ecom-Agent-Router CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    - name: Run Package & CLI Tests
      run: |
        python -c "import ecom_agent; print('Package import test passed! Version:', ecom_agent.__version__)"
        python -m ecom_agent.cli run --input ./input --output ./output
        python -m ecom_agent.cli analyze --keywords "test"
