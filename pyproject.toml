[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecom-agent-router"
version = "1.0.0"
description = "Autonomous AI Agent Framework for E-Commerce Product Listing Optimization"
readme = "README.md"
authors = [{ name = "Ecom-Agent-Router Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[project.scripts]
ecom-agent = "ecom_agent.cli:main"
